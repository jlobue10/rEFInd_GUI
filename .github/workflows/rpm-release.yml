name: RPM Package Release

# Builds the Fedora RPM with rpmbuild inside a Fedora container, for x86_64
# and (on an arm64 runner) aarch64, and attaches them (plus the source RPM) to
# the GitHub Release for the tag — replaces the manual VM build.
#
# Runs automatically on version tags; workflow_dispatch takes an existing tag
# so a package can be (re)built for a release after the fact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and attach the package to'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44@sha256:89f61a124414261868224666aa7fb8df1b78397a53623774bdfb105d1612b48b
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Install build dependencies
        run: dnf install -y rpm-build git-core cmake gcc-c++ make qt6-qtbase-devel qt6-qttools-devel

      # Default checkout: the tag itself on tag pushes, the dispatched branch
      # on manual runs. The packaging recipe (spec) comes from that ref, while
      # the packaged source is the tag the spec pins via v%{version} — so
      # dispatching from main rebuilds an old release with the current recipe,
      # and the Version guard below keeps the pairing honest.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify release tag signature
        env:
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          KEY=.github/release-signing-key.asc
          if [ -f "$KEY" ] && grep -q '^-----BEGIN PGP PUBLIC KEY BLOCK-----' "$KEY"; then
            echo "Verifying signature of tag $TAG against the committed release key..."
            gpg --quiet --import "$KEY"
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if ! git verify-tag "$TAG"; then
              echo "::error::Tag $TAG is not signed by the trusted release key (must be an annotated tag made with 'git tag -s')."
              exit 1
            fi
            echo "Tag signature verified."
          else
            echo "::warning::No release signing key committed at $KEY yet; skipping tag signature verification. See SIGNING-TAGS.md to enable."
          fi

      - name: Check spec Version matches the tag
        run: |
          version="$(sed -n 's/^Version:[[:space:]]*//p' rEFInd_GUI.spec)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::spec Version=${version} does not match tag ${TAG}; bump the spec before tagging."
            exit 1
          fi

      - name: Build RPM (rpmbuild)
        run: |
          mkdir -p ~/rpmbuild/SPECS ~/rpmbuild/SOURCES
          cp rEFInd_GUI.spec ~/rpmbuild/SPECS/
          # Stage both SourceN files the spec declares: Source0 (bg) AND Source1
          # (theme randomizer unit). rpmbuild verifies declared sources exist
          # before %prep, so omitting Source1 fails the build with "Bad source".
          cp rEFInd_bg_randomizer.service rEFInd_theme_randomizer.service ~/rpmbuild/SOURCES/
          rpmbuild -ba ~/rpmbuild/SPECS/rEFInd_GUI.spec
          mkdir out
          cp ~/rpmbuild/RPMS/*/rEFInd_GUI-*.rpm out/
          cp ~/rpmbuild/SRPMS/rEFInd_GUI-*.src.rpm out/
          ls -l out

      - name: Upload RPMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-packages
          path: out/*.rpm

  # Same recipe on GitHub's arm64 runner: produces the aarch64 RPM the
  # installer picks on ARM64 machines (ASUS ProArt P16 / NVIDIA N1X).
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    # linux/arm64/v8 digest of the same fedora:44 tag the x86-64 job pins
    # (the digests are per-architecture image manifests, not the tag's index).
    container: fedora:44@sha256:e402cca673711fee025f9ce21c6c08b1bd25ee26b3c482119c8675fbaaedbc85
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Install build dependencies
        run: dnf install -y rpm-build git-core cmake gcc-c++ make qt6-qtbase-devel qt6-qttools-devel

      # Default checkout: the tag itself on tag pushes, the dispatched branch
      # on manual runs. The packaging recipe (spec) comes from that ref, while
      # the packaged source is the tag the spec pins via v%{version} — so
      # dispatching from main rebuilds an old release with the current recipe,
      # and the Version guard below keeps the pairing honest.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify release tag signature
        env:
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          KEY=.github/release-signing-key.asc
          if [ -f "$KEY" ] && grep -q '^-----BEGIN PGP PUBLIC KEY BLOCK-----' "$KEY"; then
            echo "Verifying signature of tag $TAG against the committed release key..."
            gpg --quiet --import "$KEY"
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if ! git verify-tag "$TAG"; then
              echo "::error::Tag $TAG is not signed by the trusted release key (must be an annotated tag made with 'git tag -s')."
              exit 1
            fi
            echo "Tag signature verified."
          else
            echo "::warning::No release signing key committed at $KEY yet; skipping tag signature verification. See SIGNING-TAGS.md to enable."
          fi

      - name: Check spec Version matches the tag
        run: |
          version="$(sed -n 's/^Version:[[:space:]]*//p' rEFInd_GUI.spec)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::spec Version=${version} does not match tag ${TAG}; bump the spec before tagging."
            exit 1
          fi

      - name: Build RPM (rpmbuild)
        run: |
          mkdir -p ~/rpmbuild/SPECS ~/rpmbuild/SOURCES
          cp rEFInd_GUI.spec ~/rpmbuild/SPECS/
          # Stage both SourceN files the spec declares: Source0 (bg) AND Source1
          # (theme randomizer unit). rpmbuild verifies declared sources exist
          # before %prep, so omitting Source1 fails the build with "Bad source".
          cp rEFInd_bg_randomizer.service rEFInd_theme_randomizer.service ~/rpmbuild/SOURCES/
          # Binary package only: the x86_64 job already publishes the
          # (architecture-independent) source RPM.
          rpmbuild -bb ~/rpmbuild/SPECS/rEFInd_GUI.spec
          mkdir out
          cp ~/rpmbuild/RPMS/*/rEFInd_GUI-*.rpm out/
          ls -l out

      - name: Upload RPM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-packages-aarch64
          path: out/*.rpm

  release:
    needs: [build, build-aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Download x86_64 RPMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rpm-packages
          path: release

      - name: Download aarch64 RPM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rpm-packages-aarch64
          path: release

      - name: Generate checksums
        run: |
          cd release
          for f in *.rpm; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256

      - name: Attach RPMs to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            release/*.rpm
            release/*.sha256
